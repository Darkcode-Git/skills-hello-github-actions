<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Listado de Empleados</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background: #f2f2f2; }
        a.button { display: inline-block; margin-bottom: 1rem; padding: 0.4rem 0.8rem; background: #1976d2; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<h2>Empleados</h2>
<a class="button" th:href="@{/edit}">Agregar empleado</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.firstName}"></td>
        <td th:text="${employee.lastName}"></td>
        <td th:text="${employee.email}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${employee.id})}">Editar</a>
            |
            <a th:href="@{/delete/{id}(id=${employee.id})}">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
